# Publica web/ (el port JS de HARMFUL) en GitHub Pages.
# Cada push a `juego` actualiza la versión jugable en:
#   https://bboyero.github.io/harmful/
#
# Requiere una vez: repo -> Settings -> Pages -> Source: "GitHub Actions".
name: Deploy web a GitHub Pages

on:
  push:
    branches: [juego]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
